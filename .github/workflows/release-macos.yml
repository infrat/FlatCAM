name: Release FlatCAM macOS package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2026.4.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Validate version format
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "::error::Invalid version format '${{ inputs.version }}'. Expected YYYY.M.PATCH (e.g. 2026.4.1)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag does not already exist
        shell: bash
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            FlatCAM/requirements.txt

      - name: Install system libraries
        shell: bash
        run: |
          brew install cairo pkg-config

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Strip --hash flags so pip can resolve ARM64 wheels / build from source
          sed -E 's/ *--hash=sha256:[a-f0-9]+//g; s/ *\\$//;' FlatCAM/requirements.txt \
            | grep -v '^[[:space:]]*$' > /tmp/requirements_nohash.txt
          pip install -r /tmp/requirements_nohash.txt
          pip install pyinstaller language_data

      - name: Compile Qt resources
        shell: bash
        run: |
          pyrcc5 FlatCAM/resources.qrc -o FlatCAM/resources.py
          pyrcc5 FlatCAM/resources_dark.qrc -o FlatCAM/resources_dark.py

      - name: Build app bundle with PyInstaller
        shell: bash
        run: |
          rm -rf build dist
          pyinstaller --clean -y flatcam.spec

      - name: Smoke test app startup
        shell: bash
        run: |
          set -euo pipefail
          ./dist/FlatCAM.app/Contents/MacOS/FlatCAM > /tmp/flatcam_ci_run.log 2>&1 &
          APP_PID=$!

          sleep 12

          if kill -0 "$APP_PID" 2>/dev/null; then
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          fi

          echo "=== FlatCAM startup log (head) ==="
          head -n 200 /tmp/flatcam_ci_run.log || true

          if grep -Eiq "Traceback|ModuleNotFoundError|unrecognized arguments: -B -S -I -c" /tmp/flatcam_ci_run.log; then
            echo "Critical startup errors detected in FlatCAM log."
            exit 1
          fi

      - name: Create DMG package
        shell: bash
        run: |
          rm -f FlatCAM.dmg
          hdiutil create -volname "FlatCAM" -srcfolder dist/FlatCAM.app -ov -format UDZO FlatCAM.dmg

      - name: Package FlatCAM.app for upload
        shell: bash
        run: |
          cd dist && zip -r -y ../FlatCAM-app.zip FlatCAM.app

      - name: Create Git tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: FlatCAM ${{ inputs.version }} (macOS Apple Silicon)
          generate_release_notes: true
          files: |
            FlatCAM-app.zip
            FlatCAM.dmg

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlatCAM-release-build-logs
          path: |
            /tmp/flatcam_ci_run.log
            build/flatcam/warn-flatcam.txt
            build/flatcam/xref-flatcam.html
          if-no-files-found: warn
